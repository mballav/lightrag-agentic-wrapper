# Production stack: wrapper API talks to a standalone LightRAG server.
#   docker compose -f docker-compose.prod.yaml up --build
#
# Same services as docker-compose.yaml, with prod credential files and the
# LightRAG server. Run this file on its own. Combining it with
# docker-compose.yaml concatenates ports, volumes, and env_file lists.
#
# Configuration:
#   env/stack/prod/*.env        one credential file per data service
#   env/lightrag-config/.env.prod
#   env/wrapper/.env.prod
# `environment` below only replaces hostnames and paths inside the Docker network.
#
# ${APP_PORT} and the other ${...} host bindings read a project `.env` or the
# shell. They do not read the env files above.
#
# Host data paths (Compose interpolation):
#   LIGHTRAG_RAG_STORAGE=/path/on/host/server-rag-storage
#   LIGHTRAG_INPUTS=/path/on/host/server-inputs
#   WRAPPER_UPLOADS=/path/on/host/wrapper-uploads
#   NEO4J_LICENSES=/path/on/host/neo4j-licenses   # optional Bloom license file dir

x-container-env: &container-env
  POSTGRES_HOST: postgres
  NEO4J_URI: neo4j://neo4j:7687
  MILVUS_URI: http://milvus:19530
  DOCLING_ENDPOINT: http://docling:5001
  WORKING_DIR: /app/data/rag_storage
  INPUT_DIR: /app/data/inputs

services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - env/stack/prod/postgres.env
      - env/stack/prod/neo4j.env
      - env/stack/prod/milvus.env
      - env/lightrag-config/.env.prod
      - env/wrapper/.env.prod
    environment:
      <<: *container-env
      APP_HOST: 0.0.0.0
      WRAPPER_UPLOAD_DIR: /app/data/wrapper/uploads
      LIGHTRAG_SERVER_URL: http://lightrag:9621
    volumes:
      - ${LIGHTRAG_RAG_STORAGE:-./data/server/rag_storage}:/app/data/rag_storage
      - ${LIGHTRAG_INPUTS:-./data/server/inputs}:/app/data/inputs
      - ${WRAPPER_UPLOADS:-./data/wrapper/uploads}:/app/data/wrapper/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      lightrag:
        condition: service_healthy
    restart: unless-stopped

  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    ports:
      - "127.0.0.1:${LIGHTRAG_PORT:-9621}:9621"
    env_file:
      - env/stack/prod/postgres.env
      - env/stack/prod/neo4j.env
      - env/stack/prod/milvus.env
      - env/lightrag-config/.env.prod
    environment:
      <<: *container-env
    volumes:
      - ${LIGHTRAG_RAG_STORAGE:-./data/server/rag_storage}:/app/data/rag_storage
      - ${LIGHTRAG_INPUTS:-./data/server/inputs}:/app/data/inputs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      docling:
        condition: service_healthy
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9621/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  docling:
    image: ghcr.io/docling-project/docling-serve-cpu:latest
    ports:
      - "127.0.0.1:${DOCLING_PORT:-5001}:5001"
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 180s
    restart: unless-stopped

  postgres:
    image: postgres:16-bookworm
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    env_file:
      - env/stack/prod/postgres.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  neo4j:
    image: neo4j:5-enterprise
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    env_file:
      - env/stack/prod/neo4j.env
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: ${NEO4J_ACCEPT_LICENSE_AGREEMENT:-eval}
      NEO4J_PLUGINS: '["bloom"]'
      NEO4J_dbms_security_procedures_unrestricted: bloom.*
      NEO4J_dbms_security_procedures_allowlist: bloom.*
      NEO4J_dbms_default__database: neo4j
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins
      - ${NEO4J_LICENSES:-./licenses}:/licenses
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:7474 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.6.11
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    ports:
      - "127.0.0.1:${MILVUS_PORT:-19530}:19530"
    env_file:
      - env/stack/prod/milvus.env
      - env/stack/prod/minio.env
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    restart: unless-stopped

  milvus-etcd:
    image: milvusdb/etcd:3.5.25-r1
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - milvus-etcd_data:/etcd
    command: >
      etcd
      -advertise-client-urls=http://0.0.0.0:2379
      -listen-client-urls=http://0.0.0.0:2379
      -data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 20s
      timeout: 20s
      retries: 5
    restart: unless-stopped

  milvus-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    env_file:
      - env/stack/prod/minio.env
    volumes:
      - milvus-minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  neo4j_plugins:
  milvus_data:
  milvus-etcd_data:
  milvus-minio_data:
